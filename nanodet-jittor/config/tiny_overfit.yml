# NanoDet-Plus-m VOC2007 tiny overfit config (Jittor)

save_dir: workspace/tiny_overfit

model:
  weight_averager:
    name: ExpMovingAverager
    decay: 0.9998
  arch:
    name: NanoDetPlus
    detach_epoch: 10
    backbone:
      name: ShuffleNetV2
      model_size: 1.0x
      out_stages: [2,3,4]
      activation: LeakyReLU
    fpn:
      name: GhostPAN
      in_channels: [116, 232, 464]
      out_channels: 96
      kernel_size: 5
      num_extra_level: 1
      use_depthwise: True
      activation: LeakyReLU
    head:
      name: NanoDetPlusHead
      num_classes: 20
      input_channel: 96
      feat_channels: 96
      stacked_convs: 2
      kernel_size: 5
      strides: [8, 16, 32, 64]
      activation: LeakyReLU
      reg_max: 7
      norm_cfg:
        type: BN
      loss:
        loss_qfl:
          name: QualityFocalLoss
          use_sigmoid: True
          beta: 2.0
          loss_weight: 1.0
        loss_dfl:
          name: DistributionFocalLoss
          loss_weight: 0.25
        loss_bbox:
          name: GIoULoss
          loss_weight: 2.0
    aux_head:
      name: SimpleConvHead
      num_classes: 20
      input_channel: 192
      feat_channels: 192
      stacked_convs: 4
      strides: [8, 16, 32, 64]
      activation: LeakyReLU
      reg_max: 7

class_names: &class_names [
  'aeroplane', 'bicycle', 'bird', 'boat', 'bottle',
  'bus', 'car', 'cat', 'chair', 'cow',
  'diningtable', 'dog', 'horse', 'motorbike', 'person',
  'pottedplant', 'sheep', 'sofa', 'train', 'tvmonitor'
]

data:
  train:
    name: XMLDataset
    class_names: *class_names
    img_path: data/VOCdevkit/VOC2007/JPEGImages
    ann_path: data/VOCdevkit/VOC2007/Annotations
    split_file: data/tiny_splits/tiny50.txt
    input_size: [320, 320]
    keep_ratio: True
    pipeline:
      # 关闭增强，便于过拟合
      normalize: [[103.53, 116.28, 123.675], [57.375, 57.12, 58.395]]
  val:
    name: XMLDataset
    class_names: *class_names
    img_path: data/VOCdevkit/VOC2007/JPEGImages
    ann_path: data/VOCdevkit/VOC2007/Annotations
    split_file: data/tiny_splits/tiny50.txt
    input_size: [320, 320]
    keep_ratio: True
    pipeline:
      normalize: [[103.53, 116.28, 123.675], [57.375, 57.12, 58.395]]

device:
  gpu_ids: [0]
  workers_per_gpu: 2
  batchsize_per_gpu: 8
  precision: 32

schedule:
  optimizer:
    name: AdamW
    lr: 0.001
    weight_decay: 0.05
  warmup:
    name: linear
    steps: 50
    ratio: 0.0001
  total_epochs: 20
  lr_schedule:
    name: MultiStepLR
    milestones: [12, 18]
    gamma: 0.1
  val_intervals: 1

grad_clip: 35

evaluator:
  name: CocoDetectionEvaluator
  save_key: mAP

log:
  interval: 10
