# NanoDet-Plus-m VOC2007 Configuration
# For PyTorch and Jittor comparison experiments

save_dir: workspace/nanodet-plus-m_320_voc

model:
  weight_averager:
    name: ExpMovingAverager
    decay: 0.9998
    sync_interval: 10  # EMA 内存泄露修复：定期强制同步
  arch:
    name: NanoDetPlus
    detach_epoch: 10
    backbone:
      name: ShuffleNetV2
      model_size: 1.0x
      out_stages: [2,3,4]
      activation: LeakyReLU
    fpn:
      name: GhostPAN
      in_channels: [116, 232, 464]
      out_channels: 96
      kernel_size: 5
      num_extra_level: 1
      use_depthwise: True
      activation: LeakyReLU
    head:
      name: NanoDetPlusHead
      num_classes: 20  # VOC has 20 classes
      input_channel: 96
      feat_channels: 96
      stacked_convs: 2
      kernel_size: 5
      strides: [8, 16, 32, 64]
      activation: LeakyReLU
      reg_max: 7
      norm_cfg:
        type: BN
      loss:
        loss_qfl:
          name: QualityFocalLoss
          use_sigmoid: True
          beta: 2.0
          loss_weight: 1.0
        loss_dfl:
          name: DistributionFocalLoss
          loss_weight: 0.25
        loss_bbox:
          name: GIoULoss
          loss_weight: 2.0
    # Auxiliary head, only use in training time.
    aux_head:
      name: SimpleConvHead
      num_classes: 20  # VOC has 20 classes
      input_channel: 192
      feat_channels: 192
      stacked_convs: 4
      strides: [8, 16, 32, 64]
      activation: LeakyReLU
      reg_max: 7

# VOC 20 classes
class_names: &class_names [
  'aeroplane', 'bicycle', 'bird', 'boat', 'bottle',
  'bus', 'car', 'cat', 'chair', 'cow',
  'diningtable', 'dog', 'horse', 'motorbike', 'person',
  'pottedplant', 'sheep', 'sofa', 'train', 'tvmonitor'
]

data:
  train:
    name: XMLDataset
    class_names: *class_names
    img_path: data/VOCdevkit/VOC2007/JPEGImages
    ann_path: data/VOCdevkit/VOC2007/Annotations
    split_file: data/VOCdevkit/VOC2007/ImageSets/Main/trainval.txt
    input_size: [320, 320]  # [w,h]
    keep_ratio: True
    pipeline:
      perspective: 0.0
      scale: [0.6, 1.4]
      stretch: [[0.8, 1.2], [0.8, 1.2]]
      rotation: 0
      shear: 0
      translate: 0.2
      flip: 0.5
      brightness: 0.2
      contrast: [0.6, 1.4]
      saturation: [0.5, 1.2]
      normalize: [[103.53, 116.28, 123.675], [57.375, 57.12, 58.395]]
  val:
    name: XMLDataset
    class_names: *class_names
    img_path: data/VOCdevkit/VOC2007/JPEGImages
    ann_path: data/VOCdevkit/VOC2007/Annotations
    split_file: data/VOCdevkit/VOC2007/ImageSets/Main/test.txt
    input_size: [320, 320]  # [w,h]
    keep_ratio: True
    pipeline:
      normalize: [[103.53, 116.28, 123.675], [57.375, 57.12, 58.395]]

device:
  gpu_ids: [0]
  workers_per_gpu: 12
  batchsize_per_gpu: 64
  precision: 32

schedule:
  optimizer:
    name: AdamW
    lr: 0.001
    weight_decay: 0.05
  warmup:
    name: linear
    steps: 300
    ratio: 0.0001
  total_epochs: 50
  lr_schedule:
    name: MultiStepLR
    milestones: [30, 45]
    gamma: 0.1
  val_intervals: 10

grad_clip: 35

evaluator:
  name: CocoDetectionEvaluator
  save_key: mAP

log:
  interval: 50
